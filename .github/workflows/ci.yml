name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: gofmt
        run: test -z "$(gofmt -l cmd internal)" || (gofmt -d cmd internal; exit 1)

      - name: vet
        run: go vet ./...

      - name: test
        run: go test -race ./...

      - name: build
        run: go build ./...

      # The plugin entry point is shell; catch syntax errors before users do.
      - name: shellcheck kaku-tab.tmux
        run: bash -n kaku-tab.tmux
